AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wolfscratch Peforming Arts API

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: app.lambda_handler
      MemorySize: 128
      Timeout: 5
      Events:
        HealthRequest:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
  ProgramsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: programId
          AttributeType: S
      KeySchema:
        - AttributeName: programId
          KeyType: HASH
  ProgramsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: programs.lambda_handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:  
          PROGRAMS_TABLE: !Ref ProgramsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProgramsTable
      Events:
        ListPrograms:
          Type: HttpApi
          Properties:
            Path: /programs
            Method: GET
        GetProgram:
          Type: HttpApi
          Properties: 
            Path: /programs/{programId}
            Method: GET
            
