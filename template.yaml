AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wolfscratch Peforming Arts API

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: app.lambda_handler
      MemorySize: 128
      Timeout: 5
      Events:
        HealthRequest:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
  ProgramsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: programId
          AttributeType: S
      KeySchema:
        - AttributeName: programId
          KeyType: HASH
  ProgramsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: programs.lambda_handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:  
          PROGRAMS_TABLE: !Ref ProgramsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProgramsTable
      Events:
        ListPrograms:
          Type: HttpApi
          Properties:
            Path: /programs
            Method: GET
        GetProgram:
          Type: HttpApi
          Properties: 
            Path: /programs/{programId}
            Method: GET
  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: classId
          AttributeType: S
        - AttributeName: programId
          AttributeType: S  
      KeySchema:
        - AttributeName: classId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ClassesByProgram
          KeySchema:
            - AttributeName: programId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
  ClassesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: classes.lambda_handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:  
          CLASSES_TABLE: !Ref ClassesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClassesTable
      Events:
        GetClassesByProgram:
          Type: HttpApi
          Properties: 
            Path: /programs/{programId}/classes
            Method: GET        
        GetClass:
          Type: HttpApi
          Properties:
            Path: /classes/{classId} 
            Method: GET   
  MeetingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: meetingId
          AttributeType: S
        - AttributeName: classId
          AttributeType: S
        - AttributeName: startsAt
          AttributeType: S    
      KeySchema:
        - AttributeName: meetingId
          KeyType: HASH  
      GlobalSecondaryIndexes:
        - IndexName: MeetingsByClass
          KeySchema:
            - AttributeName: classId
              KeyType: HASH
            - AttributeName: startsAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL  
  MeetingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Architectures:
        - arm64
      CodeUri: src/
      Handler: meetings.lambda_handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:  
          MEETINGS_TABLE: !Ref MeetingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MeetingsTable
      Events:
        GetMeetingsByClass:
          Type: HttpApi
          Properties: 
            Path: /classes/{classId}/meetings
            Method: GET
